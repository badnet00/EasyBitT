<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>EasyBitT 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      </span>
      <div>
        <div class="t1">EasyBitT 设置</div>
        <div class="t2">右键推送磁力链接 / 种子到内网 qBittorrent WebUI</div>
      </div>
    </header>

    <section class="card">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01"/><path d="M6 18h.01"/></svg>
        WebUI 连接
      </h2>
      <div class="frow">
        <label for="baseUrl">WebUI 地址</label>
        <input id="baseUrl" class="input mono" type="text" spellcheck="false" placeholder="http://192.168.1.100:8085">
        <label for="username">用户名</label>
        <div>
          <input id="username" class="input" type="text" autocomplete="off" placeholder="可留空">
          <p class="hint">qBittorrent 配置了网段免密（白名单）时，用户名密码均可留空</p>
        </div>
        <label for="password">密码</label>
        <input id="password" class="input" type="password" autocomplete="new-password" placeholder="可留空">
      </div>
      <div class="testrow">
        <button type="button" class="btn btn-ghost" id="test">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          测试连接
        </button>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        默认参数
      </h2>
      <div class="frow">
        <label for="savePath">默认下载目录</label>
        <input id="savePath" class="input mono" type="text" spellcheck="false" placeholder="/vol1/1000/downloads/">
        <label for="category">默认分类</label>
        <input id="category" class="input" type="text" list="cats" placeholder="可留空">
        <datalist id="cats">
          <option value="软件镜像"></option>
          <option value="电影"></option>
          <option value="剧集"></option>
          <option value="音乐"></option>
        </datalist>
        <label for="paused">默认开始状态</label>
        <select id="paused" class="input">
          <option value="start">立即开始</option>
          <option value="paused">添加后暂停</option>
        </select>
      </div>
    </section>

    <div class="foot">
      <button type="button" class="btn btn-primary" id="save">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        保存设置
      </button>
    </div>
  </main>

  <div class="toast" id="toast" aria-live="polite" hidden>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span id="toast-text"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
